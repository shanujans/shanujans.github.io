    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        background: #0C0C0C;
        color: #D7E2EA;
        font-family: 'Kanit', sans-serif;
        overflow-x: clip;
        cursor: none;
      }

      #root { background: #0C0C0C; overflow-x: clip; }

      ::selection { background: #B600A8; color: #fff; }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: #0C0C0C; }
      ::-webkit-scrollbar-thumb { background: #B600A8; border-radius: 3px; }

      /* Hero gradient heading */
      .hero-heading {
        background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Contact button */
      .contact-btn {
        background: linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%);
        box-shadow: 0px 4px 4px rgba(181,1,167,0.25), 4px 4px 12px #7721B1 inset;
        outline: 2px solid white;
        outline-offset: -3px;
        border-radius: 9999px;
        color: white;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        padding: 1rem 3rem;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        border: none;
        font-family: 'Kanit', sans-serif;
        font-size: 0.95rem;
        white-space: nowrap;
      }
      .contact-btn:hover { transform: translateY(-2px); box-shadow: 0px 8px 24px rgba(181,1,167,0.4), 4px 4px 20px #7721B1 inset; }

      /* Scrollbar chatbot */
      .scrollbar-thin::-webkit-scrollbar { width: 3px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,255,157,0.2); border-radius: 3px; }

      /* Chatbot bounce */
      @keyframes bounce { 0%,100% { transform:translateY(0); opacity:0.4; } 50% { transform:translateY(-4px); opacity:1; } }

      /* Loading screen */
      .font-jetbrains-mono { font-family: 'JetBrains Mono', monospace; }
      @keyframes fadeInUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
      .hero-fade-in-up { opacity:0; transform:translateY(28px); animation:fadeInUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
      .glitch-text { position:relative; color:#fff; }
      .animated-gradient-text {
        background: linear-gradient(90deg, #00ff9d, #00b3ff, #7700ff, #ff6b35, #00ff9d);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradientShift 8s ease infinite;
      }
      @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

      /* CV / contact inputs */
      .contact-input {
        width:100%; background:transparent;
        border:1.5px solid rgba(255,255,255,0.15); border-radius:6px;
        padding:1.4rem 1rem 0.6rem; color:#fff;
        font-size:0.9rem; font-family:'JetBrains Mono',monospace;
        transition:border-color 0.3s; outline:none;
      }
      .contact-input:focus { border-color:#B600A8; box-shadow:0 0 0 3px rgba(182,0,168,0.1); }
      .contact-label {
        position:absolute; top:1rem; left:1rem;
        font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:#6b7280;
        background:#0C0C0C; padding:0 4px; pointer-events:none; transition:all 0.2s ease;
      }
      .contact-input:focus + .contact-label,
      .contact-input:not(:placeholder-shown) + .contact-label { top:0.2rem; font-size:0.65rem; color:#B600A8; }

      /* Btn classes used by CVRequestModal */
      .btn-primary { display:inline-flex;align-items:center;justify-content:center;padding:0.7rem 1.6rem;font-size:0.9rem;font-weight:600;font-family:'JetBrains Mono',monospace;border-radius:6px;text-transform:uppercase;letter-spacing:0.08em;transition:all 0.3s;border:1.5px solid #00ff9d;background:#00ff9d;color:#0C0C0C;cursor:pointer;text-decoration:none; }
      .btn-primary:hover { background:transparent;color:#00ff9d;transform:translateY(-2px); }
      .btn-secondary { display:inline-flex;align-items:center;justify-content:center;padding:0.7rem 1.6rem;font-size:0.9rem;font-weight:600;font-family:'JetBrains Mono',monospace;border-radius:6px;text-transform:uppercase;letter-spacing:0.08em;transition:all 0.3s;border:1.5px solid #00b3ff;background:transparent;color:#00b3ff;cursor:pointer;text-decoration:none; }
      .btn-secondary:hover { background:#00b3ff;color:#0C0C0C;transform:translateY(-2px); }
      .btn-tertiary { display:inline-flex;align-items:center;justify-content:center;padding:0.7rem 1.6rem;font-size:0.9rem;font-weight:600;font-family:'JetBrains Mono',monospace;border-radius:6px;text-transform:uppercase;letter-spacing:0.08em;transition:all 0.3s;border:1.5px solid #7700ff;background:transparent;color:#7700ff;cursor:pointer;text-decoration:none; }
      .btn-tertiary:hover { background:#7700ff;color:#fff;transform:translateY(-2px); }

      /* Scroll margin */
      .scroll-mt-20 { scroll-margin-top:5rem; }

      /* Mobile cursor */
      @media (pointer:coarse) { body { cursor:auto; } }
